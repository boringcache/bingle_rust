name: unit-tests

# Run the workspace unit tests on every pull request (open, push more commits,
# reopen, or change the base branch) and on pushes to staging. The job named
# below ("unit") is what you mark as a required status check in branch
# protection so a failing or incomplete run blocks merge. See CI-UNIT-TESTS.md.
on:
  workflow_dispatch:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  push:
    branches: [staging]

# Cancel an in-flight run when the same PR/branch gets new commits, so an
# amended PR is always graded on its latest state.
concurrency:
  group: unit-tests-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  checks: write        # allow the test-reporter to publish the JUnit summary

jobs:
  unit:
    name: unit
    runs-on: ubuntu-latest
    # Skip draft PRs; they run again automatically on "ready_for_review".
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    env:
      CARGO_TERM_COLOR: always
      CARGO_INCREMENTAL: '0'
      BORINGCACHE_CARGO_POLICY: ${{ github.event_name != 'pull_request' && github.repository_owner == 'boringcache' && 'write' || 'read-only' }}
      # Fail the build on any compiler warning, matching the "no warnings"
      # requirement in CLAUDE.md.
      RUSTFLAGS: "-D warnings"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false

      # Pin Rust for reproducible target and compiler-cache reuse.
      # OpenSSL is vendored, so it builds from source (perl + cc are
      # preinstalled on ubuntu-latest) — no libssl-dev needed.
      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
        with:
          toolchain: 1.98.1

      - name: Prepare Cargo dependencies
        uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7 # v1.30.1
        with:
          mode: archive
          cache-profiles: dependencies
          trust-policy: ${{ env.BORINGCACHE_CARGO_POLICY == 'write' && 'publish' || 'restore' }}
          fail-on-cache-error: true

      - name: Use source-based build timestamps
        run: printf 'SOURCE_DATE_EPOCH=%s\n' "$(git show -s --format=%ct HEAD)" >> "$GITHUB_ENV"

      # nextest gives per-test process isolation, a hard per-test timeout, and
      # JUnit output. The repo already defines [profile.ci] in .config/nextest.toml
      # (20s slow-timeout, one retry, junit.xml).
      - name: Install cargo-nextest
        uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
        with:
          tool: cargo-nextest@0.9.143,sccache@0.17.0

      # Compile the unit test target for every crate first, so a build/compile
      # break is reported as a failure (an "incomplete" run) that blocks merge.
      - name: Build unit tests
        run: >
          boringcache cargo --${{ env.BORINGCACHE_CARGO_POLICY }} --profile unit --skip-save test --no-run --locked
          -p bingle_core -p bingle_webserver -p bingle_local -p bingle_jsi
          --test unit

      - name: Run unit tests
        run: >
          boringcache cargo --${{ env.BORINGCACHE_CARGO_POLICY }} --profile unit --skip-restore nextest run --profile ci --no-fail-fast
          -p bingle_core -p bingle_webserver -p bingle_local -p bingle_jsi
          --test unit

      # Publish a readable pass/fail table on the PR even when tests fail.
      - name: Publish test report
        uses: dorny/test-reporter@a43b3a5f7366b97d083190328d2c652e1a8b6aa2 # v3
        if: always()
        with:
          name: unit test results
          path: target/nextest/ci/junit.xml
          reporter: java-junit
          fail-on-error: false
