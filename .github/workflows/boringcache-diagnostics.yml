name: BoringCache native diagnostics
'on':
  workflow_dispatch:
    inputs:
      cli_version:
        description: Optional exact BoringCache CLI release or prerelease tag
        type: string
        default: ''
      series:
        description: Cache series shared by the seed, warm and rolling builds
        type: string
        default: september-2026-diagnostic
      provider:
        description: Storage provider to diagnose
        type: choice
        options:
        - GitHub
        - BoringCache
        default: GitHub
      reproducible_build_metadata:
        description: Set SOURCE_DATE_EPOCH to the recorded source commit time
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: boringcache-diagnostic-${{ inputs.provider }}
  cancel-in-progress: false
jobs:
  cold:
    name: ${{ matrix.provider }} ${{ matrix.case }} cold
    if: github.repository_owner == 'boringcache' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider:
        - ${{ inputs.provider }}
        case:
        - host
        - android
    env:
      VALIDATION_SERIES: ${{ inputs.series }}
      VALIDATION_PROVIDER: ${{ matrix.provider }}
      VALIDATION_CASE: ${{ matrix.case }}
      VALIDATION_PHASE: cold
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CC: cc
      CXX: c++
      SCCACHE_LOG: sccache::server=debug,sccache::compiler::compiler=debug
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Record and verify the upstream source
      run: 'mkdir -p "$RUNNER_TEMP/validation"

        source_commit=$(cat .github/boringcache-source)

        git diff --exit-code "$source_commit" -- . '':!.github/boringcache*'' '':!.github/workflows/boringcache*'' '':!.boringcache.toml''

        git rev-parse HEAD > "$RUNNER_TEMP/validation/workflow-commit.txt"

        printf ''%s\n'' "$source_commit" > "$RUNNER_TEMP/validation/source-commit.txt"

        uname -a > "$RUNNER_TEMP/validation/runner.txt"

        df -h >> "$RUNNER_TEMP/validation/runner.txt"

        test "$VALIDATION_SERIES" != ''''

        [[ "$VALIDATION_SERIES" =~ ^[a-zA-Z0-9-]+$ ]]

        python3 - <<''PY''

        import os, pathlib

        p = pathlib.Path(''.boringcache.toml'')

        p.write_text(p.read_text().replace(''validation-series'', os.environ[''VALIDATION_SERIES''] + ''-'' + os.environ[''VALIDATION_CASE'']))

        PY

        cp .boringcache.toml "$RUNNER_TEMP/validation/cache-plan.toml"

        '
      shell: bash
    - name: Set reproducible build metadata when requested
      if: inputs.reproducible_build_metadata
      shell: bash
      run: 'source_commit=$(cat .github/boringcache-source)

        printf "SOURCE_DATE_EPOCH=%s\n" "$(git show -s --format=%ct "$source_commit")" >> "$GITHUB_ENV"

        '
    - name: Configure native diagnostic log
      shell: bash
      run: 'printf "SCCACHE_ERROR_LOG=%s/sccache-diagnostic.log\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.98.1
        targets: x86_64-linux-android
    - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
      with:
        tool: sccache@0.17.0
    - name: Record compiler and dependency identity
      run: 'rustc -Vv | tee "$RUNNER_TEMP/validation/rustc.txt"

        cargo -V

        sccache --version

        cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/validation/cargo-metadata.json"

        sha256sum Cargo.lock > "$RUNNER_TEMP/validation/lock.sha256"

        '
    - name: Install native build prerequisites
      run: 'sudo apt-get update

        sudo apt-get install --yes pkg-config libssl-dev cmake protobuf-compiler

        '
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      if: matrix.case == 'android'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      if: matrix.case == 'android'
    - name: Prepare the upstream Android NDK
      if: matrix.case == 'android'
      run: 'sdkmanager "ndk;27.1.12297006"

        printf ''ANDROID_NDK_HOME=%s/ndk/27.1.12297006\n'' "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

        '
    - name: Configure GitHub sccache storage
      if: matrix.provider == 'GitHub'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'core.exportVariable(''ACTIONS_RESULTS_URL'', process.env.ACTIONS_RESULTS_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          core.exportVariable(''ACTIONS_CACHE_SERVICE_V2'', ''true'');

          core.exportVariable(''SCCACHE_GHA_ENABLED'', ''on'');

          core.exportVariable(''SCCACHE_GHA_VERSION'', `${process.env.VALIDATION_SERIES}-${process.env.VALIDATION_CASE}`);

          core.exportVariable(''SCCACHE_GHA_RW_MODE'', process.env.VALIDATION_PHASE === ''warm'' ? ''READ_ONLY'' : ''READ_WRITE'');

          core.exportVariable(''RUSTC_WRAPPER'', ''sccache'');

          '
    - name: Configure BoringCache
      id: cache
      if: matrix.provider == 'BoringCache'
      uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7
      with:
        cli-version: ${{ inputs.cli_version }}
        mode: sccache
        trust-policy: publish
        fail-on-cache-error: true
        fail-on-cache-miss: false
    - name: Run the upstream workload
      run: bash .github/boringcache-build.sh 2>&1 | tee "$RUNNER_TEMP/validation/workload.log"
      shell: bash
    - name: Retain native compiler statistics
      if: always()
      run: 'sccache --show-stats --stats-format=json > "$RUNNER_TEMP/validation/sccache.json"

        if [[ "$VALIDATION_PROVIDER" == GitHub ]]; then sccache --stop-server; fi

        '
      shell: bash
    - name: Retain native cache diagnostics
      if: always()
      run: python3 .github/boringcache-native-evidence.py
    - name: Retain measurements and product evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.provider }}-${{ matrix.case }}-cold
        path: '${{ runner.temp }}/validation

          ${{ steps.cache.outputs.evidence-path }}

          '
        if-no-files-found: error
        retention-days: 30
  warm:
    name: ${{ matrix.provider }} ${{ matrix.case }} warm
    if: github.repository_owner == 'boringcache' && github.ref == 'refs/heads/boringcache-validation'
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix:
        provider:
        - ${{ inputs.provider }}
        case:
        - host
        - android
    env:
      VALIDATION_SERIES: ${{ inputs.series }}
      VALIDATION_PROVIDER: ${{ matrix.provider }}
      VALIDATION_CASE: ${{ matrix.case }}
      VALIDATION_PHASE: warm
      CARGO_INCREMENTAL: '0'
      CARGO_TERM_COLOR: never
      CC: cc
      CXX: c++
      SCCACHE_LOG: sccache::server=debug,sccache::compiler::compiler=debug
    steps:
    - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      with:
        persist-credentials: false
        fetch-depth: 0
    - name: Record and verify the upstream source
      run: 'mkdir -p "$RUNNER_TEMP/validation"

        source_commit=$(cat .github/boringcache-source)

        git diff --exit-code "$source_commit" -- . '':!.github/boringcache*'' '':!.github/workflows/boringcache*'' '':!.boringcache.toml''

        git rev-parse HEAD > "$RUNNER_TEMP/validation/workflow-commit.txt"

        printf ''%s\n'' "$source_commit" > "$RUNNER_TEMP/validation/source-commit.txt"

        uname -a > "$RUNNER_TEMP/validation/runner.txt"

        df -h >> "$RUNNER_TEMP/validation/runner.txt"

        test "$VALIDATION_SERIES" != ''''

        [[ "$VALIDATION_SERIES" =~ ^[a-zA-Z0-9-]+$ ]]

        python3 - <<''PY''

        import os, pathlib

        p = pathlib.Path(''.boringcache.toml'')

        p.write_text(p.read_text().replace(''validation-series'', os.environ[''VALIDATION_SERIES''] + ''-'' + os.environ[''VALIDATION_CASE'']))

        PY

        cp .boringcache.toml "$RUNNER_TEMP/validation/cache-plan.toml"

        '
      shell: bash
    - name: Set reproducible build metadata when requested
      if: inputs.reproducible_build_metadata
      shell: bash
      run: 'source_commit=$(cat .github/boringcache-source)

        printf "SOURCE_DATE_EPOCH=%s\n" "$(git show -s --format=%ct "$source_commit")" >> "$GITHUB_ENV"

        '
    - name: Configure native diagnostic log
      shell: bash
      run: 'printf "SCCACHE_ERROR_LOG=%s/sccache-diagnostic.log\n" "$RUNNER_TEMP" >> "$GITHUB_ENV"

        '
    - uses: dtolnay/rust-toolchain@4cda84d5c5c54efe2404f9d843567869ab1699d4
      with:
        toolchain: 1.98.1
        targets: x86_64-linux-android
    - uses: taiki-e/install-action@fcf5432d9f50d67e37ee6e29bdb7a224ff67b4a7
      with:
        tool: sccache@0.17.0
    - name: Record compiler and dependency identity
      run: 'rustc -Vv | tee "$RUNNER_TEMP/validation/rustc.txt"

        cargo -V

        sccache --version

        cargo metadata --locked --no-deps --format-version 1 > "$RUNNER_TEMP/validation/cargo-metadata.json"

        sha256sum Cargo.lock > "$RUNNER_TEMP/validation/lock.sha256"

        '
    - name: Install native build prerequisites
      run: 'sudo apt-get update

        sudo apt-get install --yes pkg-config libssl-dev cmake protobuf-compiler

        '
    - uses: actions/setup-java@b6effb05e454b25005698d916606bdc6ffcbf961
      if: matrix.case == 'android'
      with:
        distribution: temurin
        java-version: '17'
    - uses: android-actions/setup-android@9fc6c4e9069bf8d3d10b2204b1fb8f6ef7065407
      if: matrix.case == 'android'
    - name: Prepare the upstream Android NDK
      if: matrix.case == 'android'
      run: 'sdkmanager "ndk;27.1.12297006"

        printf ''ANDROID_NDK_HOME=%s/ndk/27.1.12297006\n'' "$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"

        '
    - name: Configure GitHub sccache storage
      if: matrix.provider == 'GitHub'
      uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
      with:
        script: 'core.exportVariable(''ACTIONS_RESULTS_URL'', process.env.ACTIONS_RESULTS_URL || '''');

          core.exportVariable(''ACTIONS_RUNTIME_TOKEN'', process.env.ACTIONS_RUNTIME_TOKEN || '''');

          core.exportVariable(''ACTIONS_CACHE_SERVICE_V2'', ''true'');

          core.exportVariable(''SCCACHE_GHA_ENABLED'', ''on'');

          core.exportVariable(''SCCACHE_GHA_VERSION'', `${process.env.VALIDATION_SERIES}-${process.env.VALIDATION_CASE}`);

          core.exportVariable(''SCCACHE_GHA_RW_MODE'', process.env.VALIDATION_PHASE === ''warm'' ? ''READ_ONLY'' : ''READ_WRITE'');

          core.exportVariable(''RUSTC_WRAPPER'', ''sccache'');

          '
    - name: Configure BoringCache
      id: cache
      if: matrix.provider == 'BoringCache'
      uses: boringcache/one@404b744a2053da4cf963f13f615f7fafe94f3cf7
      with:
        cli-version: ${{ inputs.cli_version }}
        mode: sccache
        trust-policy: restore
        fail-on-cache-error: true
        fail-on-cache-miss: true
    - name: Run the upstream workload
      run: bash .github/boringcache-build.sh 2>&1 | tee "$RUNNER_TEMP/validation/workload.log"
      shell: bash
    - name: Retain native compiler statistics
      if: always()
      run: 'sccache --show-stats --stats-format=json > "$RUNNER_TEMP/validation/sccache.json"

        if [[ "$VALIDATION_PROVIDER" == GitHub ]]; then sccache --stop-server; fi

        '
      shell: bash
    - name: Retain native cache diagnostics
      if: always()
      run: python3 .github/boringcache-native-evidence.py
    - name: Retain measurements and product evidence
      if: always()
      uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
      with:
        name: ${{ matrix.provider }}-${{ matrix.case }}-warm
        path: '${{ runner.temp }}/validation

          ${{ steps.cache.outputs.evidence-path }}

          '
        if-no-files-found: error
        retention-days: 30
    needs: cold
