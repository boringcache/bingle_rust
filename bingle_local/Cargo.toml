[package]
name = "bingle_local"
version = "0.3.3"
edition = "2024"
description = "Local API crate for storing messages and contacts for Bingle (placeholder)."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
autotests = false

# docs.rs build metadata; see docs/api-surface.md.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bingle_local"
path = "src/lib.rs"

[dependencies]
bingle_core = { path = "../bingle_core", version = "0.3.3" }
algo_ops = "0.7.7"
# Sidewinder sidechain node client: the store-and-forward Mailbox (FIFO) ops the offline path posts
# to and reads from (store-and-forward epic #200, story #213). Built on the same algo_ops handle.
sidewinder_ops = "0.7.7"
# The sidewinder_ops client surfaces errors as `anyhow::Error`; we downcast them to classify
# unreachable/not-found causes when mapping to BingleError.
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Give-up nudge (bingle_notify #11): sign the canonical /alert envelope and POST it best-effort.
base64 = "0.21"
getrandom = "0.2"
reqwest = { version = "0.11", features = ["json", "blocking"] }

[[test]]
# Unit tests: all bingle_local tests are local unit-style tests.
name = "unit"
path = "tests/api.rs"

[[test]]
# Sidewinder Mailbox round-trip (store-and-forward epic #200, story #213). Needs a running
# Sidewinder node; skips cleanly (passes without running) when the node env is unset — see the
# test's module docs. Kept out of the `unit` target so the fast suite needs no infrastructure.
name = "sidewinder_mailbox_e2e"
path = "tests/sidewinder_mailbox_e2e.rs"

[[test]]
# Post-on-delivery-fail end to end (store-and-forward epic #200, story #214). Needs a Sidewinder
# node plus enrolled/registered accounts; skips cleanly when unconfigured — see the test's module
# docs. Kept out of the `unit` target so the fast suite needs no infrastructure.
name = "post_on_delivery_fail_e2e"
path = "tests/post_on_delivery_fail_e2e.rs"

[[test]]
# Read-on-reconnect end to end (store-and-forward epic #200, story #215). Needs a Sidewinder node;
# skips cleanly when unconfigured — see the test's module docs. Kept out of the `unit` target so the
# fast suite needs no infrastructure.
name = "read_on_reconnect_e2e"
path = "tests/read_on_reconnect_e2e.rs"

[dev-dependencies]
tempfile = "3"
bingle_test = { path = "../bingle_test" }

[lints]
workspace = true
