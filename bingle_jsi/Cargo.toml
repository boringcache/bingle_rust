[package]
name = "bingle_jsi"
version = "0.3.3"
edition = "2024"
description = "React Native JSI bridge for Bingle using uniffi proc macros."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
# React Native bridge crate — not consumed as a library dependency, so not published to crates.io.
publish = false
autotests = false

[lib]
name = "bingle_jsi"
path = "src/lib.rs"
crate-type = ["lib", "staticlib", "cdylib"]

[dependencies]
uniffi = { version = "0.28", features = ["cli"] }
thiserror = "1"
bingle_core = { path = "../bingle_core", version = "0.3.3" }
algo_ops = "0.8.1"
bingle_local = { path = "../bingle_local", version = "0.3.3" }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["registry"] }
chrono = { version = "0.4", features = ["serde"] }

# Android needs rustls-platform-verifier initialized with the JNI context before any HTTPS to an
# Algorand node (issue #135). Same versions already resolved transitively via algonaut->reqwest, so
# these are feature-unified with that instance (the global the reqwest Verifier reads).
[target.'cfg(target_os = "android")'.dependencies]
jni = "0.22"
rustls-platform-verifier = "0.7"

[dev-dependencies]
uniffi = { version = "0.28", features = ["build"] }
tempfile = "3"
bingle_test = { path = "../bingle_test" }

[build-dependencies]
vergen = { version = "8", features = ["build", "git", "gitcl", "cargo"] }

# Unit tests: all bingle_jsi tests are local unit-style tests.
[[test]]
name = "unit"
path = "tests/all.rs"

[lints]
workspace = true
