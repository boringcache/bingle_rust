[package]
name = "bingle_webserver"
version = "0.3.3"
edition = "2024"
description = "HTTP/WebSocket server exposing the Bingle messaging engine over an axum-based API."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
# Server application crate — not consumed as a library dependency, so not published to crates.io.
publish = false
autotests = false

[dependencies]
axum = { version = "0.7", features = ["ws"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tower = { version = "0.5", features = ["util"] }
tower-http = { version = "0.5", features = ["cors"] }
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
bingle_core = { path = "../bingle_core", version = "0.3.3" }
algo_ops = "0.7.7"
bingle_local = { path = "../bingle_local", version = "0.3.3" }

[dev-dependencies]
bingle_test = { path = "../bingle_test" }
reqwest = { version = "0.11", features = ["json"] }
ntest = "0.9"
serial_test = "3"
tempfile = "3"

[[test]]
# Unit tests: all bingle_webserver tests are local unit-style tests.
name = "unit"
path = "tests/all.rs"

[lints]
workspace = true
