[package]
name = "bingle_test"
version = "0.3.3"
edition = "2024"
# Test-support crate — never published to crates.io.
publish = false
readme = "README.md"

[lib]
name = "bingle_test"
path = "src/lib.rs"
crate-type = ["staticlib", "rlib"]

# Localnet backend provisioner for the bingle_jsi Detox e2e (issue #123): stands up relays, STUN,
# an echo peer and funded/registered accounts on a running algokit localnet, then parks until
# killed. Needs the `localnet` feature (which pulls in bingle_core/test-hooks).
[[bin]]
name = "localnet_e2e_provisioner"
path = "src/bin/localnet_e2e_provisioner.rs"
required-features = ["localnet"]

[dependencies]
base64 = "0.21"
data-encoding = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }

# Depend on the main crate for real backend access to AlgoOps
bingle_core = { path = "../bingle_core" }
algo_ops = "0.8.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
libc = "0.2"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }

[features]
# Reusable algokit-localnet integration harness (bingle_test::localnet). Enables the in-process
# relay/client test hooks in bingle_core. Off by default so normal builds don't pull test-only APIs.
localnet = ["bingle_core/test-hooks"]

[lints]
workspace = true
