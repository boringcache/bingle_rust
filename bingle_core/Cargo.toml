[package]
name = "bingle_core"
version = "0.3.3"
edition = "2024"
description = "Core library for Bingle: a peer-to-peer messaging engine with Algorand-based node registration and discovery."
license = "MIT OR Apache-2.0"
repository = "https://github.com/binglefoundation/bingle_rust"
readme = "README.md"
autotests = false

# docs.rs builds with default features (leaving `test-hooks` off, so the test-only accessor never
# appears in the published reference). `--cfg docsrs` enables optional `#[cfg_attr(docsrs, doc(cfg(…)))]`
# gating without needing a nightly toolchain for normal builds. See docs/api-surface.md.
[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]

[lib]
name = "bingle_core"
path = "src/lib.rs"
crate-type = ["rlib"]

[dependencies]
# Core deps kept iOS-friendly; heavy platform-specific deps remain gated below.
blockchain_ops = "0.8.1"
# 0.8.0 adds fetch_opted_in_accounts_cached — the generic incremental opted-in-account scan that
# indexer_query_opted_in_accounts_sync delegates to instead of hand-rolling paging/cache; 0.8.1 adds
# AccountScanCache::clear(), used by clear_accounts_cache to reset the cache (issue #231).
algo_ops = "0.8.1"
algonaut = "0.8.0"
anyhow = "1"
thiserror = "1"
base64 = "0.21"
data-encoding = "2"
sha2 = "0.10"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = "0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt", "rt-multi-thread", "macros"] }
tokio-openssl = "0.6"
stun-rs = "0.1.11"
uuid = { version = "1", features = ["v4"] }
libc = "0.2"
ctrlc = { version = "3", features = ["termination"] }
tracing = "0.1"
# tracing-subscriber = { version = "0.3", features = ["env-filter"] } # Moving to dev-deps if only used there, or keep here if needed for lib
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
chrono = { version = "0.4", features = ["serde"] }
openssl = { version = "0.10.81", features = ["vendored"] }
openssl-sys = { version = "0.9.117" }
# X25519 keys for store-and-forward Diffie-Hellman (issue #201). Pinned to v2 so it shares
# curve25519-dalek 4.x with ed25519-dalek 2 rather than pulling a second copy (v3 -> dalek 5).
# `static_secrets` enables the reusable `StaticSecret` used for the converted identity key.
x25519-dalek = { version = "2", features = ["static_secrets"] }
hpke = { version = "0.12", default-features = false, features = ["x25519", "alloc"] }

[features]
# Exposes the unsafe test-only accessor `access_unsafe_for_tests`. Enabled automatically for this
# crate's test/example/bench targets via the self dev-dependency below; a normal `cargo build
# [--release]` (which does not pull dev-dependencies) leaves it off, so the accessor is absent from
# production builds.
test-hooks = []

[dev-dependencies]
# env_logger removed in favor of tracing-subscriber
bingle_test = { path = "../bingle_test" }
ntest = "0.9"
serial_test = "3"
# Self dev-dependency: turns on `test-hooks` when building bingle_core's own tests (integration test
# binaries link the crate as a normal dependency, so `cfg(test)` is false for lib code there).
bingle_core = { path = ".", features = ["test-hooks"] }

[build-dependencies]
vergen = { version = "8", features = ["build", "git", "gitcl", "cargo"] }

# Unit tests: local tests with no external resource requirements
[[test]]
name = "unit"
path = "tests/unit_all.rs"

# Integration tests: require algokit localnet or live internet access
[[test]]
name = "integration"
path = "tests/integration_all.rs"

# Blockchain integration tests: require algokit localnet
[[test]]
name = "integration_blockchain"
path = "tests/integration_blockchain.rs"

# All tests combined: unit + integration + flaky
[[test]]
name = "all"
path = "tests/all_all.rs"

# Dedicated DTLS stage-1 worker test target to make RustRover run/debug directly.
[[test]]
name = "dtls_peer_worker_stage1"
path = "tests/dtls/dtls_peer_worker_stage1.rs"

# Keep endpoint_available as its own test target for Docker-based testnet runs
[[test]]
name = "endpoint_available"
path = "tests/e2e/testnet/endpoint_available.rs"

# E2E: ping a registered node on testnet (Docker-based)
[[test]]
name = "ping_registered_node"
path = "tests/e2e/testnet/ping_registered_node.rs"

# Flaky or currently broken tests — known to be unreliable or needing investigation
[[test]]
name = "flaky"
path = "tests/flaky_all.rs"

[lints]
workspace = true
